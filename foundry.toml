[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"

[rpc_endpoints]
base = "${BASE_RPC_URL}"
monad = "${MONAD_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=8453" }
monad = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=143" }
