name: Bytecode Parity

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'foundry.toml'
      - 'hardhat.config.cts'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]

jobs:
  parity:
    name: Compare Hardhat vs Forge runtime bytecode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install npm deps
        run: npm ci

      - name: Hardhat compile
        run: npx hardhat compile --force

      - name: Forge build
        run: forge build --force

      - name: Compare runtime bytecode keccak
        run: |
          set -euo pipefail
          fail=0
          for contract in QuicknodeEarn QuicknodeEarnProxy; do
            hh_bytecode=$(jq -r '.deployedBytecode' "artifacts/contracts/${contract}.sol/${contract}.json")
            forge_bytecode=$(jq -r '.deployedBytecode.object' "out/${contract}.sol/${contract}.json")

            hh_hash=$(printf '%s' "$hh_bytecode" | cast keccak)
            forge_hash=$(printf '%s' "$forge_bytecode" | cast keccak)

            echo "${contract}: hardhat=${hh_hash} forge=${forge_hash}"
            if [ "$hh_hash" != "$forge_hash" ]; then
              echo "::error::Runtime bytecode for ${contract} differs between Hardhat and Forge — likely OpenZeppelin version skew"
              fail=1
            fi
          done
          exit $fail
